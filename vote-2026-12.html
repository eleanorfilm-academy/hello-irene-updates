<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irene 12 月新風格投票</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ig:linear-gradient(100deg,#515BD4 0%,#8134AF 22%,#DD2A7B 50%,#F58529 100%);
  --bg:#141019; --card:#1e1826; --line:rgba(255,255,255,.09);
  --tx:#f2edf7; --tx2:#b8aec6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans TC',sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:56px 20px 64px;text-align:center}
.kicker{display:inline-block;font-size:13px;letter-spacing:3px;color:var(--tx2);border:1px solid var(--line);border-radius:999px;padding:6px 18px;margin-bottom:22px}
h1{font-size:28px;font-weight:900;line-height:1.35;margin-bottom:10px}
h1 .grad{background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:24px 0}
.card img{width:100%;border-radius:10px;display:block}
.card .name{font-size:18px;font-weight:800;margin-top:12px}
p{font-size:15.5px;color:var(--tx2);margin-bottom:12px}
a.btn{display:inline-block;background:var(--ig);color:#fff;font-weight:700;border-radius:999px;padding:10px 24px;text-decoration:none;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">HELLO IRENE · 12 月新風格投票</div>
  <h1 id="title">收到你的票了 <span class="grad">🗳️</span></h1>
  <div class="card" id="card" hidden>
    <img id="img" alt="">
    <div class="name" id="name"></div>
  </div>
  <p id="msg">謝謝你參與！投票到 11 月 25 日截止，得票最多的風格就是 12 月的新主角，結果會寫在下一期《Irene 更新報》。</p>
  <a class="btn" href="report-2026-11.html">回到本期更新報</a>
</div>
<script>
(function(){
  var OPTIONS = {
    news:   {name:"📺 新聞快報 Breaking News", img:"assets/vote-2026-12_news.jpg"},
    sticky: {name:"🗒️ 便利貼白板 Sticky Notes", img:"assets/vote-2026-12_sticky.jpg"},
    pixel:  {name:"🎮 像素遊戲 Pixel Game", img:"assets/vote-2026-12_pixel.jpg"}
  };
  var pick = new URLSearchParams(location.search).get("pick");
  var o = Object.prototype.hasOwnProperty.call(OPTIONS, pick) ? OPTIONS[pick] : null;
  if (o) {
    document.getElementById("img").src = o.img;
    document.getElementById("img").alt = o.name;
    document.getElementById("name").textContent = "你投的是：" + o.name;
    document.getElementById("card").hidden = false;
  } else {
    document.getElementById("title").textContent = "12 月新風格投票";
    document.getElementById("msg").textContent = "投票按鈕在本期《Irene 更新報》的最後面，點你最想要的那一款就算一票，11 月 25 日截止。";
  }
})();
</script>
</body>
</html>
